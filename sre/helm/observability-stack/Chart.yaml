apiVersion: v2
name: observability-stack
description: A Helm chart for complete observability stack with Grafana, Loki, Mimir, Tempo, and k8s-monitoring
type: application
version: 1.0.0
appVersion: "1.0.0"
dependencies:
  - name: mimir-distributed
    version: ">=0.0.0"
    repository: "https://grafana.github.io/helm-charts"
  - name: loki
    version: ">=0.0.0"
    repository: "https://grafana-community.github.io/helm-charts"
  - name: tempo-distributed
    version: ">=0.0.0"
    repository: "https://grafana-community.github.io/helm-charts"
  - name: grafana
    version: ">=0.0.0"
    repository: "https://grafana-community.github.io/helm-charts"
  - name: k8s-monitoring
    version: ">=0.0.0"
    repository: "https://grafana.github.io/helm-charts"
